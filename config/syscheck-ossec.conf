<!--
  Fragmento de /var/ossec/etc/ossec.conf (agente - Ubuntu Desktop)
  Configura el módulo FIM (File Integrity Monitoring) de Wazuh,
  dentro del bloque <syscheck>...</syscheck>.

  check_all="yes"       -> verifica hash, permisos, propietario, tamaño y fecha
  report_changes="yes"  -> muestra exactamente qué cambió dentro del archivo
  realtime="yes"        -> detecta el cambio en el momento, no en el próximo escaneo
-->

<syscheck>

  <directories check_all="yes" report_changes="yes" realtime="yes">/etc</directories>
  <directories check_all="yes" report_changes="yes" realtime="yes">/root</directories>
  <directories check_all="yes" realtime="yes">/var/log</directories>
  <directories check_all="yes" report_changes="yes" realtime="yes">/tmp/laboratorio-fim</directories>

</syscheck>
